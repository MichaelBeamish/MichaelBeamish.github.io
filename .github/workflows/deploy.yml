name: Deploy

# Publishes the site to GitHub Pages (ADR 0002) — only from `main`, and only after the same checks as CI pass.
# `main` changes only through merged pull requests, so the owner decides what goes live.
on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button (e.g. to redeploy)

# The Pages deploy needs to write to Pages and prove who it is (OIDC); nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer merge waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile

      # Same gate as CI: nothing broken ever goes live.
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
