name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button; also lets us run CI on any branch

# Least privilege: the workflow token can read the repo but not write to it.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let both Node versions finish so we see every failure
      matrix:
        node: ['22', 'lts/*'] # minimum from package.json "engines" + latest LTS

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # No version given: pnpm/action-setup reads it from package.json "packageManager",
      # so CI and local always use the same pnpm.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies (exactly as locked)
        run: pnpm install --frozen-lockfile

      # Cheapest checks first; separate steps so the failing one is obvious in the UI.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
