<!doctype html>
<!--
  Source of public/og-image.jpg, the link-preview card (task #11). To remake it, see the code map's recipe:
  render this file at 1200x630 in Chrome and save the screenshot as public/og-image.jpg.
  background.jpg: a frame of The Ink Tank (?seed=2055068884), mirrored, with the mute button patched out.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 500 700;
        src: url('../../src/assets/fonts/fredoka-latin.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: system-ui, sans-serif;
        color: #eef3f7;
        background: url('background.jpg') center / cover;
      }
      .fade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(8, 14, 26, 0.9) 0%,
          rgba(8, 14, 26, 0.8) 34%,
          rgba(8, 14, 26, 0.2) 52%,
          rgba(8, 14, 26, 0) 62%
        );
      }
      .text {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 560px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        font-family: 'Fredoka', system-ui;
        font-weight: 600;
        font-size: 76px;
        line-height: 1.02;
        margin: 0 0 18px;
      }
      .role {
        font-size: 32px;
        line-height: 1.3;
        color: #ffe9b0;
        margin: 0 0 26px;
      }
      .stack {
        font-size: 24px;
        color: rgba(255, 233, 176, 0.8);
      }
      .line {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #8ee6ff, rgba(255, 233, 176, 0.6));
        box-shadow: 0 0 12px rgba(120, 225, 255, 0.5);
        margin-bottom: 26px;
      }
      .url {
        font-size: 24px;
        opacity: 0.85;
      }
      .url b {
        font-weight: 600;
        color: #eef3f7;
      }
    </style>
  </head>
  <body>
    <div class="fade"></div>
    <div class="text">
      <h1>Michael<br />Beamish</h1>
      <p class="role">
        Software Engineer — Frontend<br /><span class="stack">Vue.js · TypeScript</span>
      </p>
      <div class="line"></div>
      <div class="url">Portfolio — with residents 🐙<br /><b>michaelbeamish.github.io</b></div>
    </div>
  </body>
</html>
